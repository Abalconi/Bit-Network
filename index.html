    <script>
      // Defensive guard against browser extension injection collisions (MetaMask, Phantom, etc.)
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if (target === window && prop === 'ethereum') {
              if (descriptor && typeof descriptor === 'object') {
                descriptor.configurable = true;
                descriptor.writable = true;
              }
              try {
                return origDefineProperty.call(this, target, prop, descriptor);
              } catch (_) {
                return target;
              }
            }
            return origDefineProperty.apply(this, arguments);
          };

          window.addEventListener('error', function(e) {
            if (e && e.message && (
              e.message.indexOf('ethereum') !== -1 ||
              e.message.indexOf('redefining provider') !== -1
            )) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);
        } catch (_) {}
      })();
    </script>
